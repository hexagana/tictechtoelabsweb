const formatBullet = (text) => {
  const out = [];
  text.split(/\*\*(.*?)\*\*/g).forEach((chunk, i) => {
    if (i % 2 === 1) {
      out.push(<strong key={out.length} style={{color: inkDeep}}>{chunk}</strong>);
      return;
    }
    chunk.split(/\*(.*?)\*/g).forEach((c, j) => {
      if (!c) return;
      out.push(j % 2 === 1
        ? <em key={out.length} style={{color: "#5A5A70"}}>{c}</em>
        : <span key={out.length}>{c}</span>);
    });
  });
  return out;
};

      <div style={{maxWidth: 880, margin: "0 auto", padding: "0 16px"}}>

        {/* Intro card */}
        <div style={{
          background: "#fff",
          borderRadius: 16,
          padding: "28px 32px",
          marginTop: -24,
          boxShadow: "0 8px 30px rgba(0,0,0,0.1)",
          position: "relative",
          zIndex: 2,
          marginBottom: 28
        }}>
          <h2 style={{fontSize: 17, fontWeight: 700, color: inkDeep, marginBottom: 12}}>⚡ What this cheat code does</h2>
          <p style={{fontSize: 13.5, lineHeight: 1.75, color: "#5A5A70", marginBottom: 18}}>
            We are still in <strong style={{color: inkDeep}}>prompt engineering</strong>. Everything you wrote so far was
            <strong style={{color: inkDeep}}> your own</strong> prompt engineering. Prompt Coach is where you get
            <strong style={{color: inkDeep}}> the AI to improve your prompt engineering for you</strong> — it analyses the
            prompt you wrote, points out the weaknesses, and hands you back a better version to run in Copilot.
          </p>
          <div style={{display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 8}}>
            {topics.map(t => (
              <a key={t.id} href={`#topic${t.id}`}
                onClick={e => { e.preventDefault(); document.getElementById(`topic${t.id}`)?.scrollIntoView({behavior:"smooth"}); }}
                style={{
                  display: "flex", alignItems: "center", gap: 10,
                  padding: "10px 14px", background: "#F6F7FB", borderRadius: 10,
                  textDecoration: "none", color: "#2D2D3A", border: "1px solid transparent", cursor: "pointer"
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = coPink; e.currentTarget.style.background = "#FFF3F8"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "transparent"; e.currentTarget.style.background = "#F6F7FB"; }}
              >
                <span style={{
                  display: "flex", alignItems: "center", justifyContent: "center",
                  width: 30, height: 30, borderRadius: 8,
                  background: `linear-gradient(135deg, ${coPurple}, ${coViolet})`,
                  color: "#fff", fontWeight: 700, fontSize: 13, flexShrink: 0
                }}>{t.id}</span>
                <span style={{fontWeight: 500, fontSize: 13, lineHeight: 1.3}}>{t.title}</span>
              </a>
            ))}
          </div>
        </div>

        {/* Access warning */}
        <div style={{
          background: "linear-gradient(135deg, #FFF7ED, #FFEDD5)",
          borderLeft: "4px solid #F59E0B",
          borderRadius: "0 12px 12px 0",
          padding: "18px 22px",
          marginBottom: 36
        }}>
          <h3 style={{fontSize: 12, fontWeight: 700, color: "#B45309", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8}}>
            ⚠️ Before you start — check your access
          </h3>
          <p style={{color: "#78350F", fontSize: 13, lineHeight: 1.7, margin: 0}}>
            Not everyone will be able to open Prompt Coach. In the session, only some participants could reach the agent —
            for the rest it was <strong>switched off by the organisation</strong>. Because Prompt Coach is a
            <strong> first-party Microsoft agent</strong> and not a third-party app, this is something you can reasonably
            <strong> ask your IT / M365 administrator to enable</strong>. It is a genuine benefit to have available in a company.
          </p>
        </div>

        {/* Topics */}
        {topics.map(topic => (
          <div key={topic.id} id={`topic${topic.id}`} style={{marginBottom: 44}}>
            <div style={{
              background: `linear-gradient(135deg, ${inkDeep}, ${coViolet})`,
              borderRadius: "16px 16px 0 0",
              padding: "26px 30px"
            }}>
              <div style={{
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                width: 38, height: 38, borderRadius: 10,
                background: "rgba(255,255,255,0.2)",
                color: "#fff", fontWeight: 800, fontSize: 17, marginBottom: 10
              }}>{topic.id}</div>
              <h2 style={{fontSize: 23, fontWeight: 700, color: "#fff", lineHeight: 1.25, marginBottom: 4}}>
                {topic.icon} {topic.title}
              </h2>
              <div style={{color: "rgba(255,255,255,0.7)", fontSize: 13, marginBottom: 8}}>{topic.subtitle}</div>
              <p style={{color: "rgba(255,255,255,0.85)", fontSize: 14, lineHeight: 1.6, maxWidth: "92%"}}>{topic.description}</p>
            </div>

            <div style={{
              background: "#fff",
              borderRadius: "0 0 16px 16px",
              boxShadow: "0 4px 12px rgba(0,0,0,0.08)",
              overflow: "hidden"
            }}>
              <div style={{
                margin: "24px 28px 0",
                padding: "18px 22px",
                background: "linear-gradient(135deg, #F2FBFB, #E7F6F7)",
                borderRadius: 10,
                borderLeft: `4px solid ${coTeal}`
              }}>
                <h3 style={{fontSize: 12, fontWeight: 700, color: coTeal, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8}}>
                  💼 Use Case Scenario for Work
                </h3>
                <p style={{color: "#5A5A70", fontSize: 13, lineHeight: 1.7, margin: 0}}>{topic.useCase}</p>
              </div>

              <div style={{padding: "24px 28px 28px"}}>
                <h3 style={{
                  fontSize: 15, fontWeight: 700, color: inkDeep,
                  marginBottom: 18, paddingBottom: 10, borderBottom: "2px solid #F6F7FB"
                }}>Detailed Step-by-Step Instructions</h3>

                {topic.steps.map((step, si) => (
                  <div key={si} style={{
                    background: "#F6F7FB",
                    borderRadius: 10,
                    padding: "20px 22px",
                    marginBottom: 16,
                    border: "1px solid #E2E4ED"
                  }}>
                    <div style={{
                      fontSize: 15, fontWeight: 700, color: inkDeep,
                      marginBottom: 12, display: "flex", alignItems: "center", gap: 10
                    }}>
                      <span style={{
                        display: "inline-flex", alignItems: "center", justifyContent: "center",
                        width: 26, height: 26, borderRadius: "50%",
                        background: `linear-gradient(135deg, ${coPurple}, ${coPink})`,
                        color: "#fff", fontSize: 12, fontWeight: 700, flexShrink: 0
                      }}>{step.label}</span>
                      {step.title}
                    </div>

                    <ul style={{listStyle: "none", padding: 0, margin: "0 0 14px 0"}}>
                      {step.bullets.map((b, bi) => (
                        <li key={bi} style={{
                          position: "relative",
                          padding: "4px 0 4px 22px",
                          fontSize: 13,
                          lineHeight: 1.7,
                          color: "#2D2D3A"
                        }}>
                          <span style={{
                            position: "absolute", left: 4, top: 11,
                            width: 6, height: 6, borderRadius: "50%",
                            background: coPink
                          }}></span>
                          {formatBullet(b)}
                        </li>
                      ))}
                    </ul>

                    {step.shots && step.shots.map((s, i) => (
                      <div key={i} style={{
                        marginTop: 12,
                        borderRadius: 8,
                        overflow: "hidden",
                        border: "1px solid #E2E4ED",
                        background: "#fff"
                      }}>
                        <img src={IMG[s.img]} alt={s.cap}
                          onClick={() => setLightbox(IMG[s.img])}
                          style={{width: "100%", maxHeight: 520, objectFit: "contain", display: "block", cursor: "zoom-in", background: "#fff"}} />
                        <div style={{
                          padding: "8px 14px",
                          background: "#EEF0F6",
                          fontSize: 11,
                          fontWeight: 500,
                          color: "#6B6B80"
                        }}>
                          📸 {s.cap}
                        </div>
                      </div>
                    ))}

                    {step.diagram && (
                      <div style={{
                        marginTop: 12, borderRadius: 8, overflow: "hidden",
                        border: "1px solid #E2E4ED", background: "#1B1B2F"
                      }}>
                        <VersionLoop />
                      </div>
                    )}

                    {step.tip && (
                      <div style={{
                        background: "linear-gradient(135deg, #FFFBEB, #FEF3C7)",
                        borderLeft: "4px solid #F59E0B",
                        borderRadius: "0 10px 10px 0",
                        padding: "10px 16px",
                        marginTop: 12,
                        fontSize: 12,
                        color: "#92400E",
                        lineHeight: 1.6
                      }}>
                        <strong style={{color: "#78350F"}}>💡 Pro Tip:</strong> {step.tip}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        ))}

        {/* Recap */}
        <div style={{
          background: "#fff",
          borderRadius: 16,
          padding: "28px 32px",
          boxShadow: "0 4px 12px rgba(0,0,0,0.08)",
          marginBottom: 36
        }}>
          <h2 style={{fontSize: 17, fontWeight: 700, color: inkDeep, marginBottom: 16}}>🔁 The whole cheat code in 7 clicks</h2>
          <ol style={{margin: 0, paddingLeft: 20, color: "#2D2D3A", fontSize: 13, lineHeight: 2}}>
            <li>Open the <strong>Copilot Chat sidebar</strong> (top right)</li>
            <li>Click the <strong>↗ diagonal arrow</strong> at the top of the sidebar</li>
            <li>In the M365 portal, click <strong>Agents → All agents</strong></li>
            <li>In the <strong>Agent Store</strong> search bar, type <strong>prompt coach</strong></li>
            <li>Click <strong>Analyze Prompt</strong>, paste your prompt, submit</li>
            <li>Read the evaluation, then <strong>copy the Improved Prompt</strong></li>
            <li>Paste it back into <strong>Copilot</strong> and run your better Version 2</li>
          </ol>
        </div>

        <div style={{textAlign: "center", padding: "8px 20px 48px", color: "#6B6B80", fontSize: 12}}>
          <div style={{fontWeight: 700, color: inkDeep, fontSize: 14, marginBottom: 4}}>
            Essentials of Microsoft Copilot — Participant Learning Guide
          </div>
          <p>Created by Tic Tech Toe Labs • Follow the steps, master the tools, transform your workflow</p>
        </div>
      </div>

      {/* Lightbox */}
      {lightbox && (
        <div onClick={() => setLightbox(null)} style={{
          position: "fixed", inset: 0, background: "rgba(20,16,40,0.88)",
          display: "flex", alignItems: "center", justifyContent: "center",
          padding: 24, zIndex: 999, cursor: "zoom-out"
        }}>
          <img src={lightbox} alt="" style={{maxWidth: "100%", maxHeight: "100%", borderRadius: 10, boxShadow: "0 20px 60px rgba(0,0,0,0.5)"}} />
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PromptCoachGuide />);
  </script>
</body>
</html>
